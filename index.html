<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Node Control Center</title>
    <style>
        /* Essential structure & styling to make your JavaScript function immediately */
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --text: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Three.js canvas container background */
        #webgl-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 3D Parallax Perspective Base Container */
        .wrapper {
            perspective: 1000px;
            z-index: 2;
        }

        /* Interactive Card targeted by Part B */
        #interactiveCard {
            width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
        }

        /* Slideable tab header decoration */
        .tabs-nav {
            position: relative;
            display: flex;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
        }

        /* Tab slider targeted by Part C */
        #tabSlider {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--primary);
            border-radius: 8px;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Multi-step Panels setup */
        .panel {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Active panels triggered by switchStep() */
        .panel.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }

        /* Main interaction trigger button */
        #actionButton {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        #actionButton:hover {
            background: #2563eb;
        }
    </style>
    <!-- Include Three.js via CDN for Part A logic -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Container where the Three.js renderer attaches -->
    <div id="webgl-bg"></div>

    <div class="wrapper">
        <!-- Interactive Card Frame Component -->
        <div id="interactiveCard">
            
            <!-- Step Navigation Tabs Layer -->
            <div class="tabs-nav">
                <div id="tabSlider"></div>
                <button id="btnTab1" class="tab-btn active" onclick="switchStep(1)">Step 1</button>
                <button id="btnTab2" class="tab-btn" onclick="switchStep(2)">Step 2</button>
            </div>

            
            <div id="stepPanel1" class="panel active">

                </div>
                <div class="input-group">
                    <label for="router">Router Gateway</label>
                    <input type="text" id="router" placeholder="192.168.1.1">
                </div>
                <div class="input-group">
                    <label for="msisdn">MSISDN Phone Line</label>
                    <input type="tel" id="msisdn" placeholder="e.g. +255...">

            </div>

            <!-- STEP 2 PANEL: Core Authorization Return Fields -->
            <div id="stepPanel2" class="panel">

                <div class="input-group">
                    <label for="backendKey">Node Authentication Token</label>
                    <input type="text" id="backendKey" readonly placeholder="TOKEN-PENDING-SECURE">
                </div>
            </div>

            <!-- Direct Action Execution Mechanism -->
            <button id="actionButton">
                <span id="btnText">Connect to Core</span>
            </button>

        </div>
    </div>

</body>
</html>
