<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID | Distributed Identity Aggregator</title>
    <style>
        :root {
            --bg-dark: #070014;
            --surface-blur: rgba(13, 8, 30, 0.45);
            --neon-blue: #3b82f6;
            --cyan-glow: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #a5b4fc;
            --border-glow: rgba(255, 255, 255, 0.08);
            --gradient-accent: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            --btn-hover: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0e0426 0%, #03000a 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Liquid Glow Elements Background */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.45;
            pointer-events: none;
        }
        .blob-top-left {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
            top: -10%;
            left: -10%;
        }
        .blob-bottom-right {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #1d4ed8 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
        }
        .blob-center-mesh {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #a855f7 0%, transparent 70%);
            top: 35%;
            left: 40%;
            opacity: 0.25;
        }

        /* Glassmorphism App Layout Box */
        .app-shell { 
            background: var(--surface-blur); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px);
            max-width: 620px; 
            width: 100%; 
            padding: 45px; 
            border-radius: 32px; 
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1); 
            border: 1px solid var(--border-glow); 
            box-sizing: border-box; 
            position: relative;
            z-index: 10;
        }

        /* Branding Meta & Modern Spacing */
        .brand-meta { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 35px; 
        }
        .logo-text { 
            font-size: 28px; 
            font-weight: 900; 
            text-transform: lowercase; 
            letter-spacing: -0.5px;
        }
        .logo-text span { 
            font-weight: 300;
            opacity: 0.85;
        }
        .secure-badge { 
            background: rgba(16, 185, 129, 0.1); 
            color: #34d399; 
            padding: 7px 14px; 
            border-radius: 30px; 
            font-size: 11px; 
            font-weight: 700; 
            border: 1px solid rgba(16, 185, 129, 0.15); 
            letter-spacing: 0.5px;
        }

        /* Premium Tab Switch Navigation */
        .tab-menu { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            background: rgba(0, 0, 0, 0.4); 
            padding: 5px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            margin-bottom: 35px; 
        }
        .tab-btn { 
            padding: 14px; 
            background: transparent; 
            color: var(--text-muted); 
            font-weight: 700; 
            font-size: 13px; 
            cursor: pointer; 
            border-radius: 12px; 
            text-align: center; 
            border: none;
            transition: all 0.3s ease;
        }
        .tab-btn.active { 
            background: var(--gradient-accent); 
            color: white; 
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        /* Grid Layouts & Labels */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
        .span-2 { grid-column: span 2; }
        
        label { 
            font-weight: 600; 
            color: var(--text-muted); 
            display: block; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 10px; 
        }

        /* Unified Form Inputs with Dark High-Contrast Style */
        input[type='text'], select { 
            width: 100%; 
            padding: 16px 20px; 
            background: rgba(4, 2, 12, 0.75); 
            color: var(--text-main); 
            border: 1px solid rgba(255, 255, 255, 0.07); 
            border-radius: 14px; 
            box-sizing: border-box; 
            font-size: 15px; 
            transition: all 0.25s ease;
        }
        input[type='text']:focus, select:focus {
            outline: none;
            border-color: var(--cyan-glow);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
            background: rgba(4, 2, 12, 0.9); 
        }
        input[type='text']::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        select option {
            background: #0e0822;
            color: #fff;
        }

        /* Action Buttons styling */
        .btn-action { 
            background: var(--gradient-accent); 
            color: white; 
            border: none; 
            padding: 18px; 
            font-size: 15px; 
            font-weight: 700; 
            border-radius: 14px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 30px; 
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3); 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-action:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4); 
        }
        .btn-action:active {
            transform: translateY(1px);
        }

        /* System Messaging Alerts */
        .alert-box { 
            background: rgba(59, 130, 246, 0.1); 
            color: #93c5fd; 
            padding: 16px 20px; 
            border-radius: 14px; 
            margin-bottom: 30px; 
            border: 1px solid rgba(59, 130, 246, 0.15); 
            font-size: 14px; 
            font-weight: 600; 
            border-left: 4px solid var(--neon-blue); 
        }
        .error-msg { 
            background: rgba(239, 68, 68, 0.1); 
            color: #fca5a5; 
            padding: 16px 20px; 
            border-radius: 14px; 
            margin-bottom: 30px; 
            border: 1px solid rgba(239, 68, 68, 0.15); 
            font-size: 14px; 
            font-weight: 600; 
            border-left: 4px solid #ef4444; 
        }
        
        /* QR Asset Code Container Window */
        .qr-card-overlay { 
            background: rgba(10, 25, 20, 0.45); 
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid rgba(52, 211, 153, 0.2); 
            text-align: center; 
            margin-bottom: 35px; 
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.08); 
        }
        .qr-element-container { 
            background: #ffffff; 
            padding: 16px; 
            display: inline-block; 
            border-radius: 20px; 
            margin: 20px auto; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.35); 
            width: 172px;
            height: 172px;
            box-sizing: border-box;
        }
        .qr-element-container img {
            display: block;
            width: 140px;
            height: 140px;
        }
    </style>
</head>
<body>

    <!-- Fluid Ambient Shapes background overlay layer -->
    <div class="ambient-blob blob-top-left"></div>
    <div class="ambient-blob blob-bottom-right"></div>
    <div class="ambient-blob blob-center-mesh"></div>

    <div class="app-shell">
        <div class="brand-meta">
            <div class="logo-text">moja<span>id</span></div>
            <div class="secure-badge">🛡️ E2EE Protocol Secure</div>
        </div>
        
        <!-- RENDERING THE FLOATING WALLET TOKEN IF ACTIVATED BY THE BACKEND -->
        {% if qr_data %}
            <div class="qr-card-overlay">
                <h3 style="color:#34d399; margin:0 0 8px 0; font-size:18px;">🎉 MojaID Synchronization Successful!</h3>
                <p style="color:var(--text-muted); font-size:13px; margin:0; line-height: 1.5;">Flash this secure QR asset at any accredited hospital or financial node terminal.</p>
                
                <!-- Base64 image layout using the exact image variable -->
                <div class="qr-element-container">
                    <img src="{{ qr_data }}" alt="MojaID QR Matrix Token">
                </div>
                
                <!-- CLEAN LABEL FOR YOUR FOOTER SYSTEM -->
                <div style="font-family:monospace; font-size:11px; color:#34d399; margin-top: 10px; letter-spacing: 0.5px;">🛡️ DECENTRALIZED IDENTITY REGISTRY TOKEN GENERATED</div>
            </div>
        {% endif %}

        <div class="tab-menu">
            <div class="tab-btn active" id="profileTab" onclick="switchSection('demographics')">1. Identity Core</div>
            <div class="tab-btn" id="vaultTab" onclick="switchSection('attachments')">2. Aggregation Vault</div>
        </div>
