<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID | Premium Identity Vault</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #030712 100%);
            --panel-bg: rgba(17, 24, 39, 0.6);
            --neon-blue: #3b82f6;
            --neon-glow: 0 0 30px rgba(59, 130, 246, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .header-logo {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .header-logo span { color: var(--neon-blue); text-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
        .showcase-card {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            max-width: 500px;
            width: 100%;
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glow);
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), border-color 0.3s;
        }
        .showcase-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.25);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 0 40px rgba(59, 130, 246, 0.1);
        }
        h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px 0; text-align: center; background: linear-gradient(to right, #ffffff, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 35px; margin-top: 0; }
        .input-group { position: relative; margin-top: 22px; }
        label { font-weight: 700; color: var(--text-muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }
        input[type='text'], select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(10, 15, 30, 0.7);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.25s ease;
        }
        input[type='text']:focus, select:focus {
            outline: none;
            border-color: var(--neon-blue);
            background: rgba(10, 15, 30, 0.9);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .btn-modern {
            background: linear-gradient(90deg, var(--neon-blue) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 35px;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.25);
            transition: all 0.25s;
        }
        .btn-modern:hover {
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.45), var(--neon-glow);
            transform: scale(1.005);
        }
        .alert-box { background: rgba(59, 130, 246, 0.1); color: #93c5fd; padding: 15px; border-radius: 14px; text-align: center; margin-bottom: 25px; border: 1px solid rgba(59, 130, 246, 0.2); font-size: 14px; font-weight: 600; line-height: 1.5; }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: #fca5a5; padding: 15px; border-radius: 14px; text-align: center; margin-bottom: 25px; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header-logo">Moja<span>ID</span></div>
    <div class="showcase-card">
        <h1>Secure Identity Node</h1>
        <p class="subtitle">Distributed validation and aggregation portal</p>
        
        {% if alert_msg %}<div class="alert-box">{{ alert_msg }}</div>{% endif %}
        {% if error_msg %}<div class="error-msg">{{ error_msg }}</div>{% endif %}
        
        <form method="POST">
            <div class="input-group">
                <label>Full Business Name</label>
                <input type="text" name="full_name" placeholder="Juma Hamisi" required>
            </div>
            <div class="input-group">
                <label>Sovereign NIDA Identifier</label>
                <input type="text" name="nida_id" placeholder="199XXXXXXXXXXXX..." required>
            </div>
            <div class="input-group">
                <label>National Health Insurance (NHIF)</label>
                <input type="text" name="nhif" placeholder="e.g., NHIF-992831">
            </div>
            <div class="input-group">
                <label>Driving Registry Class</label>
                <input type="text" name="license" placeholder="e.g., A, B, C">
            </div>
            <div class="input-group">
                <label>Linked Banking Institution</label>
                <input type="text" name="bank" placeholder="e.g., CRDB, NMB">
            </div>
            <div class="input-group">
                <label>Gateway Inward Router</label>
                <select name="network">
                    <option value="M-Pesa">Vodacom M-Pesa Secure Node</option>
                    <option value="Tigo Pesa">Tigo Pesa Secure Node</option>
                    <option value="Airtel Money">Airtel Money Secure Node</option>
                    <option value="HaloPesa">HaloPesa Secure Node</option>
                </select>
            </div>
            <div class="input-group">
                <label>Verification Account Msisdn</label>
                <input type="text" name="phone" placeholder="07XXXXXXXX" required>
            </div>
            <button type="submit" class="btn-modern">⚡ Initiate Cryptographic Link (500 TZS)</button>
        </form>
    </div>
</body>
</html>
