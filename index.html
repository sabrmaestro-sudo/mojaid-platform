<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID | Distributed Sovereign Identity Hub</title>
    <style>
        :root {
            --bg-deep: #020617;
            --glass-panel: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
            --neon-emerald: #10b981;
            --neon-red: #ef4444;
            --text-primary: #f9fafb;
            --text-muted: #9ca3af;
            --glow-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 80% 20%, #1e1b4b 0%, #020617 70%);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* 🌐 SYSTEM UTILITY ACTION TOP BAR */
        .system-top-bar {
            max-width: 680px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .lang-switch-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        .lang-switch-btn:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--neon-cyan);
        }

        /* 📱 IMMERSIVE PREMIUM APPLICATION CARD */
        .app-shell {
            background: var(--glass-panel);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            max-width: 680px;
            width: 100%;
            padding: 45px;
            border-radius: 32px;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .app-shell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--glow-gradient);
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .logo-area h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .logo-area h1 span { color: var(--neon-cyan); }
        .logo-area p { margin: 4px 0 0 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .secure-badge {
            background: rgba(16, 185, 129, 0.08);
            color: var(--neon-emerald);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(16, 185, 129, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 🎛️ NAVIGATION TABS MATRIX */
        .tab-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            margin-bottom: 40px;
        }

        .tab-btn {
            padding: 14px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 12px;
            text-align: center;
            border: none;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--glow-gradient);
            color: #000000;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);
        }

        /* 📋 SYSTEM NOTIFICATIONS */
        .alert-box { background: rgba(59, 130, 246, 0.08); color: #93c5fd; padding: 16px 20px; border-radius: 16px; margin-bottom: 35px; border: 1px solid rgba(59, 130, 246, 0.15); font-size: 13px; font-weight: 600; border-left: 4px solid var(--neon-blue); }
        .error-msg { background: rgba(239, 68, 68, 0.08); color: #fca5a5; padding: 16px 20px; border-radius: 16px; margin-bottom: 35px; border: 1px solid rgba(239, 68, 68, 0.15); font-size: 13px; font-weight: 600; border-left: 4px solid var(--neon-red); }

        /* 🗚 MODERN INPUT FIELDS */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .span-2 { grid-column: span 2; }
        label { font-weight: 700; color: var(--text-muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        input[type='text'], select { width: 100%; padding: 16px 20px; background: rgba(5, 7, 15, 0.7); color: var(--text-primary); border: 1px solid var(--glass-border); border-radius: 14px; box-sizing: border-box; font-size: 15px; transition: all 0.3s; }
        input[type='text']:focus, select:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); background: rgba(5, 7, 15, 0.9); }
        
        .btn-action { background: var(--glow-gradient); color: #000000; border: none; padding: 18px; font-size: 15px; font-weight: 800; border-radius: 14px; cursor: pointer; width: 100%; margin-top: 35px; box-shadow: 0 8px 25px rgba(6, 182, 212, 0.2); text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s; }
        .btn-action:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(6, 182, 212, 0.35); }

        /* 🛡️ WALLET CARD SYSTEM OUTPUT */
        .qr-card-overlay { background: rgba(9, 13, 24, 0.6); padding: 30px; border-radius: 24px; border: 1px solid rgba(16, 185, 129, 0.25); text-align: center; margin-bottom: 40px; box-shadow: 0 0 40px rgba(16, 185, 129, 0.08); }
        .qr-element-container { background: #ffffff; padding: 16px; display: inline-block; border-radius: 20px; margin: 20px auto; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 172px; height: 172px; box-sizing: border-box; }
        .qr-element-container img { display: block; width: 140px; height: 140px; }

        /* 🔒 ACCESS LOGIN GATE OVERLAY */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; transition: all 0.3s ease; }
        .auth-modal { background: #0f172a; border: 1px solid var(--glass-border); max-width: 420px; width: 100%; padding: 40px; border-radius: 28px; box-shadow: 0 30px 70px rgba(0,0,0,0.8); text-align: center; box-sizing: border-box; position: relative; }
        .auth-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; justify-content: center; gap: 30px; }
        .auth-tab { color: var(--text-muted); font-size: 14px; font-weight: 700; text-transform: uppercase; padding-bottom: 10px; cursor: pointer; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: var(--neon-cyan); border-color: var(--neon-cyan); font-weight: 800; }
    </style>
</head>
<body>

    <!-- 🌐 UTILITY HEADER ACTIONS -->
    <div class="system-top-bar">
        <button class="lang-switch-btn" id="langBtn" onclick="toggleLanguageSystem()">🇹🇿 Swahili</button>
        <button class="lang-switch-btn" style="color: #fca5a5;" onclick="logoutSecureSession()">🔒 Lock Core</button>
    </div>

    <!-- 🔒 LOGIN AND SIGN UP MODAL ENGINE OVERLAY -->
    <div id="secureAuthOverlay" class="auth-overlay">
        <div class="auth-modal">
            <div class="auth-tabs">
                <span class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">Login</span>
                <span class="auth-tab" id="tabSignup" onclick="switchAuthMode('signup')">Sign Up</span>
            </div>
            <form method="POST" action="/" style="text-align: left;">
                <input type="hidden" name="action" value="auth">
                <div class="field-group" style="margin-bottom: 20px;">
                    <label id="lblAuthUser">Sovereign Email / Phone</label>
                    <input type="text" placeholder="citizen@mojaid.go.tz" required style="background: rgba(0,0,0,0.3);">
                </div>
                <div class="field-group" style="margin-bottom: 10px;">
                    <label id="lblAuthPass">Access Passphrase</label>
                    <input type="text" placeholder="••••••••••••" required style="background: rgba(0,0,0,0.3); font-family: monospace;">
                </div>
                <button type="button" class="btn-action" style="margin-top: 25px;" onclick="bypassSecureModal()" id="btnAuthSubmit">Authorize Access</button>
            </form>
        </div>
    </div>

    <div class="app-shell">
        <div class="brand-header">
            <div class="logo-area">
                <h1>Moja<span>ID</span></h1>
                <p id="lblSubTitle">Sovereign Identity Aggregator</p>
