<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID | Distributed Identity Aggregator</title>
    <style>
        :root {
            --bg-dark: #030712;
            --surface-blur: rgba(17, 24, 39, 0.55);
            --neon-blue: #2563eb;
            --cyan-glow: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-glow: rgba(255, 255, 255, 0.06);
            --gradient-accent: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b 0%, #030712 60%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .app-shell {
            background: var(--surface-blur);
            backdrop-filter: blur(30px);
            max-width: 640px;
            width: 100%;
            padding: 50px;
            border-radius: 32px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glow);
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .app-shell:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7), 0 0 45px rgba(59, 130, 246, 0.15);
        }
        .brand-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
        .logo-text { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .logo-text span { color: var(--cyan-glow); text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        .secure-badge { background: rgba(16, 185, 129, 0.1); color: #34d399; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.2); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* High-End Navigation Tab Blocks */
        .tab-menu { display: grid; grid-template-columns: 1fr 1fr; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 14px; border: 1px solid var(--border-glow); margin-bottom: 35px; }
        .tab-btn { padding: 12px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 13px; text-transform: uppercase; cursor: pointer; border-radius: 10px; transition: all 0.2s ease; text-align: center; }
        .tab-btn.active { background: var(--gradient-accent); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 540px) { .form-grid { grid-template-columns: 1fr; } .span-2 { grid-column: auto !important; } }
        .span-2 { grid-column: span 2; }
        
        label { font-weight: 700; color: var(--text-muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }
        input[type='text'], select {
            width: 100%;
            padding: 15px 18px;
            background: rgba(5, 7, 15, 0.7);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.25s ease;
        }
        input[type='text']:focus, select:focus {
            outline: none;
            border-color: var(--cyan-glow);
            background: rgba(5, 7, 15, 0.9);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
        }
        .btn-action {
            background: var(--gradient-accent);
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 35px;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        .btn-action:hover {
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.45), 0 0 30px rgba(56, 189, 248, 0.2);
            transform: translateY(-1px);
        }
        .alert-box { background: rgba(59, 130, 246, 0.1); color: #93c5fd; padding: 16px 20px; border-radius: 14px; margin-bottom: 30px; border: 1px solid rgba(59, 130, 246, 0.2); font-size: 14px; font-weight: 600; line-height: 1.6; border-left: 5px solid var(--neon-blue); }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: #fca5a5; padding: 16px 20px; border-radius: 14px; margin-bottom: 30px; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 14px; font-weight: 600; border-left: 5px solid #ef4444; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="brand-meta">
            <div class="logo-text">Moja<span>ID</span></div>
            <div class="secure-badge">🛡️ E2EE Protocol Secure</div>
        </div>
        
        <div class="tab-menu">
            <div class="tab-btn active" id="profileTab" onclick="switchSection('demographics')">1. Identity Core</div>
            <div class="tab-btn" id="vaultTab" onclick="switchSection('attachments')">2. Aggregation Vault</div>
        </div>

        {% if alert_msg %}<div class="alert-box">{{ alert_msg }}</div>{% endif %}
        {% if error_msg %}<div class="error-msg">{{ error_msg }}</div>{% endif %}
        
        <form method="POST">
            <!-- SECTION 1: MASTER IDENTITIES -->
            <div id="demographicsSection" class="form-grid">
                <div class="span-2">
                    <label>Full Legal Entity Name</label>
                    <input type="text" name="full_name" placeholder="e.g., Juma Hamisi" required>
                </div>
                <div class="span-2">
                    <label>Sovereign NIDA Identifier</label>
                    <input type="text" name="nida_id" placeholder="199XXXXXXXXXXXX..." required>
                </div>
                <div>
                    <label>Payment Router Selection</label>
                    <select name="network">
                        <option value="M-Pesa">Vodacom M-Pesa</option>
                        <option value="Tigo Pesa">Tigo Pesa</option>
                        <option value="Airtel Money">Airtel Money</option>
                        <option value="HaloPesa">HaloPesa</option>
                    </select>
                </div>
                <div>
                    <label>Verification Account Msisdn</label>
                    <input type="text" name="phone" placeholder="07XXXXXXXX" required>
                </div>
                <div class="span-2" style="text-align: right; margin-top: 15px;">
                    <button type="button" class="btn-action" style="margin-top:0; width:auto; padding:12px 25px;" onclick="switchSection('attachments')">Proceed to Vault ➔</button>
                </div>
            </div>

            <!-- SECTION 2: VARIABLE AGGREGATION BLOCKS -->
            <div id="attachmentsSection" class="form-grid" style="display: none;">
                <div class="span-2">
                    <label>National Health Insurance (NHIF)</label>
                    <input type="text" name="nhif" placeholder="e.g., NHIF-883100">
                </div>
                <div class="span-2">
                    <label>Driving Registry Classification</label>
                    <input type="text" name="license" placeholder="e.g., Class A, B, C, E">
                </div>
                <div class="span-2">
                    <label>Commercial Banking Node Integration</label>
                    <input type="text" name="bank" placeholder="e.g., CRDB Bank, NMB Bank">
                </div>
                <div class="span-2">
                    <button type="submit" class="btn-action">🔒 Compile & Authorize Sync (500 TZS)</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        function switchSection(target) {
            const demoForm = document.getElementById('demographicsSection');
            const vaultForm = document.getElementById('attachmentsSection');
            const t1 = document.getElementById('profileTab');
            const t2 = document.getElementById('vaultTab');

            if (target === 'attachments') {
                demoForm.style.display = 'none';
                vaultForm.style.display = 'grid';
                t1.classList.remove('active');
                t2.classList.add('active');
            } else {
                demoForm.style.display = 'grid';
                vaultForm.style.display = 'none';
                t2.classList.remove('active');
                t1.classList.add('active');
            }
        }
    </script>
</body>
</html>
