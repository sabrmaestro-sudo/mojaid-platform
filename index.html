<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID Hub</title>
    <!-- Include Three.js via CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0c10;
            font-family: sans-serif;
        }
        /* Sample placeholders for structural safety preventing runtime failures */
        #interactiveCard {
            width: 300px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .action-btn-3d {
            padding: 10px 20px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Hidden mock nodes required by step switcher functionality */
        .mock-input, #tabSlider, #btnTab1, #btnTab2, #stepPanel1, #stepPanel2 {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Container for Three.js Canvas -->
    <div id="canvas-container"></div>

    <!-- Main Interactive UI Element Layer -->
    <div id="interactiveCard">
        <div id="stepPanel1" class="active"></div>
        <div id="stepPanel2"></div>
        <div id="tabSlider"></div>
        <button id="btnTab1"></button>
        <button id="btnTab2"></button>
        
        <!-- Mock Input Elements to safeguard against undefined DOM references -->
        <input type="hidden" id="fullName" value="John Doe">
        <input type="hidden" id="nidaId" value="12345">
        <input type="hidden" id="router" value="Default_Router">
        <input type="hidden" id="msisdn" value="0700000000">
        <input type="hidden" id="vaultStatus">
        <input type="hidden" id="backendKey">

        <div>
            <button class="action-btn-3d" id="submitBtn" onclick="handlePrimaryAction()">
                <span id="btnText">Connect to Core</span>
            </button>
        </div>
    </div>

    <script>
        // --- PART A: THREE.JS 3D PARTICLE BACKGROUND MATRIX ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Build floating geometric starfield
        const geometry = new THREE.BufferGeometry();
        const verticesCount = 700;
        const posArray = new Float32Array(verticesCount * 3);

        for (let i = 0; i < verticesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10; // Scaled system boundary spread
        }
        
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const material = new THREE.PointsMaterial({
            size: 0.015,
            color: 0x3b82f6
        });

        const starParticles = new THREE.Points(geometry, material);
        scene.add(starParticles);

        camera.position.z = 3;

        // Realtime background rendering loop
        function animate3DScene() {
            requestAnimationFrame(animate3DScene);
            starParticles.rotation.y += 0.0015;
            starParticles.rotation.x += 0.0008;
            renderer.render(scene, camera);
        }
        animate3DScene();

        // Responsive Canvas Resize Matrix Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- PART B: DYNAMIC MOUSE TILT PARALLAX (3D HOVER COMPONENT) ---
        const card = document.getElementById('interactiveCard');

        document.addEventListener('mousemove', (e) => {
            // Calculate cursor vector coordinate relative to center screen axes
            let xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            // Inject parameters into CSS matrix dynamic transform calculations using backticks
            card.style.transform = `rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset frame alignment gently when mouse exits browser view matrix
        document.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
            card.style.transition = 'transform 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        // --- PART C: ASYNC FLASK ENDPOINT TRANSMISSION LAYER ---
        let currentStep = 1;

        function switchStep(stepNumber) {
            if (stepNumber === currentStep) return;
            currentStep = stepNumber;

            const slider = document.getElementById('tabSlider');
            const btn1 = document.getElementById('btnTab1');
            const btn2 = document.getElementById('btnTab2');
            const panel1 = document.getElementById('stepPanel1');
            const panel2 = document.getElementById('stepPanel2');
            const btnText = document.getElementById('btnText');

            if (stepNumber === 1) {
                slider.style.transform = 'translateX(0%)';
                btn1.classList.add('active'); 
                btn2.classList.remove('active');
                panel2.classList.remove('active');
                setTimeout(() => { panel1.classList.add('active'); }, 150);
                btnText.innerText = "Connect to Core";
            } else {
                slider.style.transform = 'translateX(100%)';
                btn2.classList.add('active'); 
                btn1.classList.remove('active');
                panel1.classList.remove('active');
                setTimeout(() => { panel2.classList.add('active'); }, 150);
                btnText.innerText = "Authorize Core Node";
            }
        }

        async function handlePrimaryAction() {
            if (currentStep === 1) {
                const payload = {
                    fullName: document.getElementById('fullName').value,
                    nidaId: document.getElementById('nidaId').value,
                    router: document.getElementById('router').value,
                    msisdn: document.getElementById('msisdn').value
                };

                switchStep(2);

                try {
                    const response = await fetch('/submit-identity', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();

                    if (data.status === "success") {
                        document.getElementById('vaultStatus').value = "🟢 Core Synced Successfully";
                        document.getElementById('backendKey').value = data.mock_key || "NODE-KEY-SECURE";
                    } else {
                        alert(data.message);
                        switchStep(1);
                    }
                } catch (e) {
                    alert("3D Node Connection Interrupt.");
                    switchStep(1);
                }
            } else {
                alert("🔒 3D Encrypted Payload Dispatched!");
            }
        }
    </script>
</body>
</html>
