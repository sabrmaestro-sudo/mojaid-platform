<!DOCTYPE html>
<html>
<head>
    <title>MojaID Wallet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6; --primary-hover: #2563eb; --border-color: rgba(255, 255, 255, 0.08); }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); max-width: 480px; width: 100%; margin: 20px auto; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color); box-sizing: border-box; text-align: left; }
        h1 { font-size: 28px; font-weight: 700; text-align: center; margin: 0 0 8px 0; }
        p.subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 25px; margin-top: 0; }
        label { font-weight: 600; color: var(--text-muted); display: block; margin-top: 18px; font-size: 13px; text-transform: uppercase; }
        input[type='text'], select { width: 100%; padding: 12px 16px; margin-top: 6px; background: rgba(15, 23, 42, 0.6); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-size: 15px; }
        .btn-submit { background-color: var(--primary); color: white; border: none; padding: 14px; font-size: 16px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 700; margin-top: 25px; }
        .alert-box { background: rgba(59, 130, 246, 0.12); color: #60a5fa; padding: 14px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(59, 130, 246, 0.2); font-size: 14px; font-weight: 600; }
        .error-msg { background: rgba(239, 68, 68, 0.12); color: #f87171; padding: 14px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div style="margin-top: 20px;"><strong style="font-size: 22px;">Moja<span style="color:var(--primary);">ID</span> Ecosystem</strong></div>
    <div class="card">
        <h1>Unified Citizen Wallet</h1>
        <p class="subtitle">Secure identity synchronization protocol</p>
        {% if alert_msg %}<div class="alert-box">{{ alert_msg }}</div>{% endif %}
        {% if error_msg %}<div class="error-msg">{{ error_msg }}</div>{% endif %}
        <form method="POST">
            <label>Full Name</label><input type="text" name="full_name" placeholder="e.g., Juma Hamisi" required>
            <label>Primary NIDA ID</label><input type="text" name="nida_id" placeholder="e.g., 199XXXXXXXXXXXX..." required>
            <label>NHIF Card Number (Optional)</label><input type="text" name="nhif" placeholder="e.g., NHIF-992831">
            <label>Driving License Class (Optional)</label><input type="text" name="license" placeholder="e.g., A, B, C">
            <label>Linked Bank Name (Optional)</label><input type="text" name="bank" placeholder="e.g., CRDB">
            <label>Billing Network Method</label>
            <select name="network">
                <option value="M-Pesa">Vodacom M-Pesa</option>
                <option value="Tigo Pesa">Tigo Pesa</option>
                <option value="Airtel Money">Airtel Money</option>
                <option value="HaloPesa">HaloPesa</option>
            </select>
            <label>Account Phone Number</label><input type="text" name="phone" placeholder="e.g., 07XXXXXXXX" required>
            <button type="submit" class="btn-submit">🔒 Securely Link Identities (500 TZS)</button>
        </form>
    </div>
</body>
</html>
