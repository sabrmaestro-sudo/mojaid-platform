<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID | External Verification Node</title>
    
    <!-- LOAD SCANNING ENGINE -->
    <script src="https://cloudflare.com" integrity="sha512-r6rDA7W6ZeQhvl8S7nEBzOxbjnUqPmGeIqvekYmgVqB7d+B95MwoEIQzUaH6wUNnvZeesbME3gUQI7ZIRHw1iQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        :root {
            --bg-terminal: #0b0f19;
            --surface-panel: #161b26;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --text-light: #f3f4f6;
            --text-gray: #9ca3af;
            --border-glow: rgba(6, 182, 212, 0.15);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-terminal);
            color: var(--text-light);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .portal-shell { max-width: 500px; width: 100%; background: var(--surface-panel); padding: 30px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid var(--border-glow); box-sizing: border-box; }
        .institution-meta { text-align: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 20px; }
        .institution-meta h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .institution-meta h2 span { color: var(--neon-cyan); }
        .institution-meta p { margin: 5px 0 0 0; font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; background: #090d16; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: white; font-size: 14px; box-sizing: border-box; font-family: monospace; }
        
        #scanner-viewport { width: 100%; background: #090d16; border-radius: 14px; overflow: hidden; border: 1px dashed var(--neon-cyan); margin-bottom: 15px; min-height: 150px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-gray); text-align: center; padding: 10px; box-sizing: border-box; }
        .btn-control { width: 100%; padding: 14px; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: black; border: none; font-weight: 800; font-size: 13px; text-transform: uppercase; border-radius: 10px; cursor: pointer; letter-spacing: 0.5px; margin-bottom: 12px; display: block; text-align: center; text-decoration: none; }
        
        .fallback-container { background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .fallback-container input[type="file"] { display: none; }
        .upload-label { background: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; display: inline-block; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.05); }
        
        .result-display { background: #090d16; border-radius: 14px; padding: 20px; display: none; border-left: 4px solid var(--neon-green); margin-top: 10px; }
        .result-display.error { border-left-color: var(--neon-red); }
        .result-display h4 { margin: 0 0 12px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .data-item { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .data-item:last-child { border: none; }
        .data-item span { color: var(--text-gray); font-weight: 600; }
        .data-item strong { color: white; }
    </style>
</head>
<body>

    <div class="portal-shell">
        <div class="institution-meta">
            <h2>Moja<span>ID</span> Node Terminal</h2>
            <p>Accredited Verification Portal</p>
        </div>

        <div class="field-group">
            <label>Secure B2B Client Access Token</label>
            <input type="text" id="b2bToken" value="mojaid_live_b2b_token_xyz789">
        </div>

        <label>Method A: Live Stream Hardware Lens</label>
        <div id="scanner-viewport">Camera feed container idle...</div>
        <button id="toggleCamBtn" class="btn-control" onclick="toggleCameraHardware()">📷 Initialize Camera Node</button>

        <div class="fallback-container">
            <label style="margin-bottom: 10px;">Method B: Device Hardware Fallback Scanner</label>
            <p style="font-size:11px; color:var(--text-gray); margin:0 0 12px 0;">If your device blocks live video streams, snap/upload an image snapshot here.</p>
            <label for="qr-file-input" class="upload-label">📸 Snap / Upload QR Code</label>
            <input type="file" id="qr-file-input" accept="image/*" onchange="processLocalImageFile(this)">
        </div>

        <div id="resultDisplay" class="result-display">
            <h4 id="resultStatus" style="color: var(--neon-green);">Verification Cleared</h4>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let isCamRunning = false;
        const imageFileDecoder = new Html5Qrcode("scanner-viewport");

        function toggleCameraHardware() {
            const btn = document.getElementById('toggleCamBtn');
            const view = document.getElementById('scanner-viewport');
            
            if (!isCamRunning) {
                isCamRunning = true;
                btn.textContent = "⚙️ Booting Lens Matrix...";
                view.textContent = "Requesting system access links...";
                btn.disabled = true;

                html5QrcodeScanner = new Html5Qrcode("scanner-viewport");
                
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, 
                    { fps: 15, qrbox: { width: 220, height: 220 } },
                    (decodedText) => {
                        processScannedToken(decodedText);
                        toggleCameraHardware(); 
                    },
                    (errorMessage) => {}
                )
                .then(() => {
                    btn.disabled = false;
                    btn.textContent = "🛑 Kill Camera Feed";
                    btn.style.background = "#ef4444";
                    btn.style.color = "white";
                })
                .catch(err => {
                    html5QrcodeScanner.start(
                        { facingMode: "any" }, 
                        { fps: 10, qrbox: { width: 200, height: 200 } },
                        (decodedText) => {
                            processScannedToken(decodedText);
                            toggleCameraHardware();
                        },
                        (errorMessage) => {}
                    )
                    .then(() => {
                        btn.disabled = false;
                        btn.textContent = "🛑 Kill Camera Feed";
                        btn.style.background = "#ef4444";
                        btn.style.color = "white";
                    })
                    .catch(fallbackErr => {
                        btn.disabled = false;
                        isCamRunning = false;
                        resetCamButton();
                        view.textContent = "⚠️ Live streaming blocked by system privacy parameters. Use Method B below.";
                    });
                });
            } else {
                isCamRunning = false;
                resetCamButton();
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        view.textContent = "Camera feed container idle...";
                    }).catch(err => console.log(err));
                }
            }
        }

        function resetCamButton() {
            const btn = document.getElementById('toggleCamBtn');
            btn.textContent = "📷 Initialize Camera Node";
            btn.style.background = "linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)";
            btn.style.color = "black";
        }

        function processLocalImageFile(inputElement) {
            if (inputElement.files.length === 0) return;
            
            const selectedFile = inputElement.files[0];
            const display = document.getElementById('resultDisplay');
            const statusText = document.getElementById('resultStatus');
            const content = document.getElementById('resultContent');
            
            display.style.display = "block";
            content.innerHTML = `<p style="font-size:12px; color:var(--text-gray);">Analyzing static file pixels for token blocks...</p>`;

            imageFileDecoder.scanFile(selectedFile, true)
                .then(decodedText => {
                    processScannedToken(decodedText);
                })
                .catch(err => {
                    display.classList.add('error');
                    statusText.style.color = "var(--neon-red)";
                    statusText.textContent = "❌ Decoder Scanning Failure";
                    content.innerHTML = `<p style="font-size:12px; margin:0;">No valid QR code found. Please snap a clearer picture.</p>`;
                });
        }

        function processScannedToken(scannedHash) {
            const token = document.getElementById('b2bToken').value;
