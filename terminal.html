<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-terminal: #0b0f19;
            --surface-panel: #161b26;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --text-light: #f3f4f6;
            --text-gray: #9ca3af;
            --border-glow: rgba(6, 182, 212, 0.15);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-terminal);
            color: var(--text-light);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .portal-shell { max-width: 500px; width: 100%; background: var(--surface-panel); padding: 30px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid var(--border-glow); box-sizing: border-box; }
        .institution-meta { text-align: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 20px; }
        .institution-meta h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .institution-meta h2 span { color: var(--neon-cyan); }
        .institution-meta p { margin: 5px 0 0 0; font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        
        .field-group { margin-bottom: 25px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; background: #090d16; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: white; font-size: 14px; box-sizing: border-box; font-family: monospace; }
        
        /* Hidden layout canvas node necessary for image processing calculations */
        #qr-processing-node { display: none; }
        
        /* Stylized Action Button Link Clicker Wrapper */
        .native-scan-trigger { display: block; text-align: center; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: #000000; font-weight: 800; font-size: 14px; text-transform: uppercase; padding: 16px; border-radius: 12px; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 8px 20px rgba(6, 182, 212, 0.2); transition: transform 0.1s ease; }
        .native-scan-trigger:active { transform: scale(0.98); }
        .native-scan-trigger input[type="file"] { display: none; }
        
        /* Response Data Display Sheet Box */
        .result-display { background: #090d16; border-radius: 14px; padding: 20px; display: none; border-left: 4px solid var(--neon-green); margin-top: 25px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); }
        .result-display.error { border-left-color: var(--neon-red); }
        .result-display h4 { margin: 0 0 12px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .data-item { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .data-item:last-child { border: none; }
        .data-item span { color: var(--text-gray); font-weight: 600; }
        .data-item strong { color: white; }
    </style>
</head>
<body>

    <div class="portal-shell">
        <div class="institution-meta">
            <h2>Moja<span>ID</span> Node Terminal</h2>
            <p>Accredited Verification Portal</p>
        </div>

        <!-- B2B SECURITY KEY HANDSHAKE PARAMETER -->
        <div class="field-group">
            <label>Secure B2B Client Access Token</label>
            <input type="text" id="b2bToken" value="mojaid_live_b2b_token_xyz789">
        </div>

        <!-- VIRTUAL BUFFER DIVISION LAYER REQUIRED BY THE THE LIBRARY ENGINE -->
        <div id="qr-processing-node"></div>

        <!-- THE NATIVE INTERACTIVE TRIGGER FRAME CLICKER -->
        <label>Hardware Scanner Authentication Portal</label>
        <label for="native-hardware-input" class="native-scan-trigger">
            📷 Scan User QR Code
            <!-- 'capture' tells smartphones to open the native system camera app instantly -->
            <input type="file" id="native-hardware-input" accept="image/*" capture="environment" onchange="decodeCapturedImage(this)">
        </label>

        <!-- SECURE LIVE TRANSACTION telemetry FEED MONITOR -->
        <div id="resultDisplay" class="result-display">
            <h4 id="resultStatus" style="color: var(--neon-green);">Verification Cleared</h4>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        // Mount image decoder wrapper targeting virtual buffer container
        const matrixDecoderEngine = new Html5Qrcode("qr-processing-node");

        function decodeCapturedImage(inputElement) {
            // Safety break if no binary image attachment exists
            if (!inputElement.files || inputElement.files.length === 0) return;
            
            // FIX: Isolate precise file index array element from system container
            const targetImageFile = inputElement.files[0];
            
            const display = document.getElementById('resultDisplay');
            const statusText = document.getElementById('resultStatus');
            const content = document.getElementById('resultContent');
            
            // Reveal loading telemetry indicators
            display.style.display = "block";
            display.classList.remove('error');
            statusText.style.color = "var(--neon-cyan)";
            statusText.textContent = "⚙️ Extracting Image Matrix...";
            content.innerHTML = `<p style="font-size:12px; color:var(--text-gray); margin:0;">Reading token string directly from local pixels...</p>`;

            // Core scanning function processing image object data parameter streams
            matrixDecoderEngine.scanFile(targetImageFile, true)
                .then(decodedHashText => {
                    // SUCCESS: QR matrix parameters extracted cleanly. Fire verify handshake.
                    executeVerificationHandshake(decodedHashText);
                })
                .catch(err => {
                    // FAILURE: Image blurry, off-center, or bad light configuration parameters
                    display.classList.add('error');
                    statusText.style.color = "var(--neon-red)";
                    statusText.textContent = "❌ Processing Matrix Block Failure";
                    content.innerHTML = `<p style="font-size:12px; margin:0;">Could not parse valid QR matrix data points. Align your target squarely, adjust lighting, and snap again.</p>`;
                    console.error("Decoder runtime halted: ", err);
                });
        }

        function executeVerificationHandshake(scannedHash) {
            const token = document.getElementById('b2bToken').value;
            const display = document.getElementById('resultDisplay');
            const statusText = document.getElementById('resultStatus');
            const content = document.getElementById('resultContent');

            statusText.style.color = "var(--neon-cyan)";
            statusText.textContent = "📡 Querying Core Ledger...";
            content.innerHTML = `<p style="font-size:12px; color:var(--text-gray); margin:0;">Authorizing secure token link route parameter fields...</p>`;

            // Asynchronous fetch call routing data tokens back to server registry pipeline
            fetch(`/api/v1/verify?qr_hash=${scannedHash}`, {
                method: 'GET',
                headers: {
                    'X-MojaID-Auth': token
                }
            })
            .then(res => {
                if (res.status === 200) {
                    display.classList.remove('error');
                    statusText.style.color = "var(--neon-green)";
                    statusText.textContent = "✅ Verification Cleared (200 OK)";
                } else {
                    display.classList.add('error');
                    statusText.style.color = "var(--neon-red)";
                    statusText.textContent = `❌ Access Denied (${res.status})`;
                }
                return res.json();
            })
            .then(payload => {
                if (payload.verified) {
                    // Populate hospital layout screen fields dynamically from JSON packet metrics stream
                    content.innerHTML = `
                        <div class="data-item"><span>Full Legal Holder:</span><strong>${payload.data.full_name}</strong></div>
                        <div class="data-item"><span>NHIF Clearance:</span><strong>${payload.data.nhif_status}</strong></div>
                        <div class="data-item"><span>Driving Classification:</span><strong>${payload.data.license_class}</strong></div>
                        <div class="data-item"><span>Registered Bank Node:</span><strong>${payload.data.banking_institution}</strong></div>
                        <div class="data-item"><span>Registry Status:</span><strong style="color:var(--neon-green)">${payload.data.account_status}</strong></div>
                    `;
                } else {
                    content.innerHTML = `<p style="font-size:12px; color:var(--neon-red); margin:0;">${payload.message}</p>`;
                }
            })
            .catch(err => {
