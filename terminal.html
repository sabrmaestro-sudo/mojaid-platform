<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID | External Verification Node</title>
    
    <!-- ⚡ HIGH-SPEED JAVASCRIPT QR DECODER CORE (NO CAMERA DEPENDENCIES) -->
    <script src="https://jsdelivr.net"></script>

    <style>
        :root {
            --bg-terminal: #0b0f19;
            --surface-panel: #161b26;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --text-light: #f3f4f6;
            --text-gray: #9ca3af;
            --border-glow: rgba(6, 182, 212, 0.15);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-terminal);
            color: var(--text-light);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .portal-shell { max-width: 500px; width: 100%; background: var(--surface-panel); padding: 30px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid var(--border-glow); box-sizing: border-box; }
        .institution-meta { text-align: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 20px; }
        .institution-meta h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .institution-meta h2 span { color: var(--neon-cyan); }
        .institution-meta p { margin: 5px 0 0 0; font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        
        .field-group { margin-bottom: 25px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; background: #090d16; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: white; font-size: 14px; box-sizing: border-box; font-family: monospace; }
        
        /* Premium Action Clicker Button */
        .native-scan-trigger { display: block; text-align: center; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: #000000; font-weight: 800; font-size: 14px; text-transform: uppercase; padding: 18px; border-radius: 12px; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 8px 20px rgba(6, 182, 212, 0.2); transition: transform 0.1s ease; border: none; width: 100%; box-sizing: border-box; }
        .native-scan-trigger:active { transform: scale(0.98); }
        .native-scan-trigger input[type="file"] { display: none; }
        
        /* Verification Status Output Panel */
        .result-display { background: #090d16; border-radius: 14px; padding: 20px; display: none; border-left: 4px solid var(--neon-green); margin-top: 25px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); }
        .result-display.error { border-left-color: var(--neon-red); }
        .result-display h4 { margin: 0 0 12px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .data-item { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .data-item:last-child { border: none; }
        .data-item span { color: var(--text-gray); font-weight: 600; }
        .data-item strong { color: white; }
    </style>
</head>
<body>

    <div class="portal-shell">
        <div class="institution-meta">
            <h2>Moja<span>ID</span> Node Terminal</h2>
            <p>Accredited Verification Portal</p>
        </div>

        <!-- B2B SECURITY KEY HANDSHAKE PARAMETER -->
        <div class="field-group">
            <label>Secure B2B Client Access Token</label>
            <input type="text" id="b2bToken" value="mojaid_live_b2b_token_xyz789">
        </div>

        <!-- THE NATIVE INTERACTIVE TRIGGER FRAME CLICKER -->
        <label>Hardware Scanner Authentication Portal</label>
        <label for="native-hardware-input" class="native-scan-trigger">
            📷 Scan User QR Code
            <!-- 'capture="environment"' forces mobile platforms to boot up their native phone camera client -->
            <input type="file" id="native-hardware-input" accept="image/*" capture="environment" onchange="processImageMatrix(this)">
        </label>

        <!-- SECURE LIVE TRANSACTION telemetry FEED MONITOR -->
        <div id="resultDisplay" class="result-display">
            <h4 id="resultStatus" style="color: var(--neon-green);">Verification Cleared</h4>
            <div id="resultContent"></div>
        </div>
    </div>

    <!-- 🔌 EMBEDDED HIGH-TOLERANCE HARDWARE CONVERTER CODES -->
    <script>
        function processImageMatrix(inputElement) {
            if (!inputElement.files || inputElement.files.length === 0) return;

            const selectedFile = inputElement.files[0];
            const display = document.getElementById('resultDisplay');
            const statusText = document.getElementById('resultStatus');
            const content = document.getElementById('resultContent');

            display.style.display = "block";
            display.classList.remove('error');
            statusText.style.color = "var(--neon-cyan)";
            statusText.textContent = "⚙️ Extracting Image Matrix...";
            content.innerHTML = `<p style="font-size:12px; color:var(--text-gray); margin:0;">Reading token string from snapshot pixels...</p>`;

            // Initialize image reader infrastructure pipeline
            const imageReader = new FileReader();
            imageReader.onload = function(event) {
                const imageObject = new Image();
                imageObject.onload = function() {
                    // Create an in-memory virtual HTML5 Canvas container frame
                    const virtualCanvas = document.createElement("canvas");
                    const canvasContext = virtualCanvas.getContext("2d");
                    
                    // Constrain maximum grid rendering allocations to save processing overhead
                    const maxBoundary = 1024;
                    let calculatedWidth = imageObject.width;
                    let calculatedHeight = imageObject.height;

                    if (calculatedWidth > maxBoundary || calculatedHeight > maxBoundary) {
                        if (calculatedWidth > calculatedHeight) {
                            calculatedHeight = Math.round((calculatedHeight * maxBoundary) / calculatedWidth);
                            calculatedWidth = maxBoundary;
                        } else {
                            calculatedWidth = Math.round((calculatedWidth * maxBoundary) / calculatedHeight);
                            calculatedHeight = maxBoundary;
                        }
                    }

                    virtualCanvas.width = calculatedWidth;
                    virtualCanvas.height = calculatedHeight;
                    
                    // Draw image pixels to canvas buffer matrix array
                    canvasContext.drawImage(imageObject, 0, 0, calculatedWidth, calculatedHeight);
                    const imagePixelArray = canvasContext.getImageData(0, 0, calculatedWidth, calculatedHeight);
                    
                    // Fire the jsQR core data array processor engine
                    const decodedMatrixResult = jsQR(imagePixelArray.data, imagePixelArray.width, imagePixelArray.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (decodedMatrixResult) {
                        // SUCCESS: Matrix tracking points identified successfully
                        executeVerificationHandshake(decodedMatrixResult.data);
                    } else {
                        // REJECTED: Pixels blurry, distorted, or unreadable
                        display.classList.add('error');
                        statusText.style.color = "var(--neon-red)";
                        statusText.textContent = "❌ Matrix Parsing Failure";
                        content.innerHTML = `<p style="font-size:12px; margin:0;">Could not parse valid QR matrix data points. Align your target squarely, clear the camera lens, and take the picture again.</p>`;
                    }
                };
                imageObject.src = event.target.result;
            };
            imageReader.readAsDataURL(selectedFile);
        }

        function executeVerificationHandshake(scannedHash) {
            const token = document.getElementById('b2bToken').value;
            const display = document.getElementById('resultDisplay');
            const statusText = document.getElementById('resultStatus');
            const content = document.getElementById('resultContent');

            statusText.style.color = "var(--neon-cyan)";
            statusText.textContent = "📡 Querying Core Ledger...";
            content.innerHTML = `<p style="font-size:12px; color:var(--text-gray); margin:0;">Authorizing secure token link route fields...</p>`;

            // Asynchronous fetch call routing data tokens back to server registry pipeline
            fetch(`/api/v1/verify?qr_hash=${scannedHash}`, {
                method: 'GET',
                headers: {
                    'X-MojaID-Auth': token
                }
            })
            .then(res => {
                if (res.status === 200) {
                    display.classList.remove('error');
                    statusText.style.color = "var(--neon-green)";
                    statusText.textContent = "✅ Verification Cleared (200 OK)";
                } else {
                    display.classList.add('error');
                    statusText.style.color = "var(--neon-red)";
