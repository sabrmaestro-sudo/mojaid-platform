<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaID | External Verification Node</title>
    
    <!-- 📷 LOAD STABLE CLIENT-SIDE HTML5 VIDEO CAMERA SCANNING ENGINE -->
    <script src="https://cloudflare.com" integrity="sha512-r6rDA7W6ZeQhvl8S7nEBzOxbjnUqPmGeIqvekYmgVqB7d+B95MwoEIQzUaH6wUNnvZeesbME3gUQI7ZIRHw1iQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        :root {
            --bg-terminal: #0b0f19;
            --surface-panel: #161b26;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --text-light: #f3f4f6;
            --text-gray: #9ca3af;
            --border-glow: rgba(6, 182, 212, 0.15);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-terminal);
            color: var(--text-light);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .portal-shell { max-width: 500px; width: 100%; background: var(--surface-panel); padding: 30px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid var(--border-glow); box-sizing: border-box; }
        .institution-meta { text-align: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 20px; }
        .institution-meta h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .institution-meta h2 span { color: var(--neon-cyan); }
        .institution-meta p { margin: 5px 0 0 0; font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-gray); letter-spacing: 1px; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; background: #090d16; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: white; font-size: 14px; box-sizing: border-box; font-family: monospace; }
        
        /* Camera UI elements */
        #scanner-viewport { width: 100%; background: #090d16; border-radius: 14px; overflow: hidden; border: 1px dashed var(--neon-cyan); margin-bottom: 20px; min-height: 250px; }
        .btn-control { width: 100%; padding: 14px; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: black; border: none; font-weight: 800; font-size: 13px; text-transform: uppercase; border-radius: 10px; cursor: pointer; letter-spacing: 0.5px; margin-bottom: 15px; }
        
        /* 📋 LIVE LEDGER OUTPUT SCREEN CONTAINER */
        .result-display { background: #090d16; border-radius: 14px; padding: 20px; display: none; border-left: 4px solid var(--neon-green); margin-top: 10px; }
        .result-display.error { border-left-color: var(--neon-red); }
        .result-display h4 { margin: 0 0 12px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .data-item { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .data-item:last-child { border: none; }
        .data-item span { color: var(--text-gray); font-weight: 600; }
        .data-item strong { color: white; }
    </style>
</head>
<body>

    <div class="portal-shell">
        <div class="institution-meta">
            <h2>Moja<span>ID</span> Node Terminal</h2>
            <p>Accredited Verification Portal</p>
        </div>

        <!-- 1. AUTHORIZATION INPUT FOR THE HANDSHAKE PROMPT -->
        <div class="field-group">
            <label>Secure B2B Client Access Token</label>
            <!-- Pre-populated with your app's true token value for smooth developer testing -->
            <input type="text" id="b2bToken" value="mojaid_live_b2b_token_xyz789" placeholder="Enter X-MojaID-Auth credential token">
        </div>

        <!-- 2. PHYSICAL HARDWARE VIDEO CAMERA FRAME -->
        <label>Hardware Scanner Viewport</label>
        <div id="scanner-viewport"></div>
        <button id="toggleCamBtn" class="btn-control" onclick="toggleCameraHardware()">📷 Initialize Camera Node</button>

        <!-- 3. REALTIME INTERACTIVE DATA CLUSTER -->
        <div id="resultDisplay" class="result-display">
            <h4 id="resultStatus" style="color: var(--neon-green);">Verification Cleared</h4>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let isCamRunning = false;

        function toggleCameraHardware() {
            const btn = document.getElementById('toggleCamBtn');
            
            if (!isCamRunning) {
                isCamRunning = true;
                btn.textContent = "🛑 Kill Camera Feed";
                btn.style.background = "#ef4444";
                btn.style.color = "white";
                
                // Initialize the library targeting the viewport div
                html5QrcodeScanner = new Html5Qrcode("scanner-viewport");
                
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, // Prioritize back phone camera
                    { fps: 10, qrbox: { width: 200, height: 200 } },
                    (decodedText) => {
                        // SUCCESS: A code was successfully intercepted by the lens matrices
                        processScannedToken(decodedText);
                        // Briefly pulse stop camera to avoid multiple instant scans
                        toggleCameraHardware(); 
                    },
                    (errorMessage) => {
                        // Scanning frame failure logs (silent to prevent console crowding)
                    }
                ).catch(err => {
                    alert("Camera access denied or device hardware mismatch: " + err);
                    isCamRunning = false;
                    resetCamButton();
                });
            } else {
                isCamRunning = false;
                resetCamButton();
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().catch(err => console.log("Stop mismatch: ", err));
                }
            }
        }

        function resetCamButton() {
            const btn = document.getElementById('toggleCamBtn');
            btn.textContent = "📷 Initialize Camera Node";
            btn.style.background = "linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)";
            btn.style.color = "black";
        }

        // 🚀 FIRE THE MACHINE-TO-MACHINE INTERACTIVE HANDSHAKE
        function processScannedToken(scannedHash) {
            const token = document.getElementById('b2bToken').value;
            const display = document.getElementById('resultDisplay');
            const statusText = document.getElementById('resultStatus');
            const content = document.getElementById('resultContent');

            display.style.display = "block";
            content.innerHTML = `<p style="font-size:12px; color:var(--text-gray);">Querying centralized registry ledger records...</p>`;

            // Fetch request mirroring exact B2B network topology architecture
            fetch(`/api/v1/verify?qr_hash=${scannedHash}`, {
                method: 'GET',
                headers: {
                    'X-MojaID-Auth': token
                }
            })
            .then(res => {
                if (res.status === 200) {
                    display.classList.remove('error');
                    statusText.style.color = "var(--neon-green)";
                    statusText.textContent = "✅ Verification Cleared (200 OK)";
                } else {
                    display.classList.add('error');
                    statusText.style.color = "var(--neon-red)";
                    statusText.textContent = `❌ Access Denied (${res.status})`;
                }
                return res.json();
            })
            .then(payload => {
                if (payload.verified) {
                    // Inject raw dataset metrics cleanly into the institution's sheet layout
                    content.innerHTML = `
                        <div class="data-item"><span>Full Legal Holder:</span><strong>${payload.data.full_name}</strong></div>
                        <div class="data-item"><span>NHIF Clearance:</span><strong>${payload.data.nhif_status}</strong></div>
                        <div class="data-item"><span>Driving Classification:</span><strong>${payload.data.license_class}</strong></div>
                        <div class="data-item"><span>Registered Bank Node:</span><strong>${payload.data.banking_institution}</strong></div>
                        <div class="data-item"><span>Registry Status:</span><strong style="color:var(--neon-green)">${payload.data.account_status}</strong></div>
                    `;
                } else {
                    content.innerHTML = `<p style="font-size:12px; color:var(--neon-red); margin:0;">${payload.message}</p>`;
                }
            })
            .catch(err => {
                display.classList.add('error');
                statusText.style.color = "var(--neon-red)";
                statusText.textContent = "🚨 Gateway Timeout Connection Error";
                content.innerHTML = `<p style="font-size:12px; margin:0;">Could not establish link parameters to the authentication root cluster pipeline.</p>`;
            });
        }
    </script>
</body>
</html>
